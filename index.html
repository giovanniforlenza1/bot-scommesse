<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Lab | Dashboard Algoritmica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #09090b;
            --card-bg: #18181b;
            --card-border: #27272a;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --wait: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        /* Navbar */
        nav { background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100; padding: 16px 24px; text-align: center; }
        nav h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; background: linear-gradient(to right, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { max-width: 700px; margin: 0 auto; padding: 24px 16px; }
        
        /* Hero Stats */
        .hero-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 32px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .stat-card.main { grid-column: span 2; background: linear-gradient(145deg, #18181b 0%, #1e1e24 100%); position: relative; overflow: hidden; }
        .stat-card.main::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 60%); pointer-events: none; }
        .stat-label { color: var(--text-muted); font-size: 12px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin-bottom: 8px; }
        .stat-value { font-size: 38px; font-weight: 800; letter-spacing: -1px; }
        .stat-value.profit { color: var(--success); }
        .stat-value.negative { color: var(--danger); }
        
        .sub-stats { font-size: 24px; }
        
        /* Titoli Sezione */
        .section-title { font-size: 16px; font-weight: 600; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        
        /* Schedine (Cards) */
        .schedina { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; transition: transform 0.2s; }
        .schedina-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--card-border); padding-bottom: 16px; margin-bottom: 16px; }
        .schedina-info { display: flex; flex-direction: column; gap: 4px; }
        .s-date { font-size: 12px; color: var(--text-muted); font-weight: 600; }
        .s-quota { font-size: 18px; font-weight: 800; }
        
        /* Badge Stati */
        .badge { padding: 6px 12px; border-radius: 30px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.vinta { background: rgba(16, 185, 129, 0.1); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); }
        .badge.persa { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge.in.attesa { background: rgba(245, 158, 11, 0.1); color: var(--wait); border: 1px solid rgba(245, 158, 11, 0.2); }

        /* Lista Partite */
        .match { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px dashed var(--card-border); }
        .match:last-child { border-bottom: none; padding-bottom: 0; }
        .m-teams { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .m-pick { font-size: 12px; color: var(--text-muted); }
        .m-result { font-weight: 800; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .m-vinta { color: var(--success); }
        .m-persa { color: var(--danger); }
        .m-attesa { color: var(--wait); font-size: 12px; }

        /* Pulsante Telegram */
        .cta-btn { display: block; width: 100%; background: #2481cc; color: white; text-align: center; padding: 16px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px; margin-top: 32px; transition: background 0.2s; }
        .cta-btn:hover { background: #1d6fa5; }
    </style>
</head>
<body>

    <nav>
        <h1>Match Lab</h1>
    </nav>

    <div class="container">
        <div class="hero-stats">
            <div class="stat-card main">
                <div class="stat-label">Cassa Simulata Live</div>
                <div class="stat-value" id="capitale">-- €</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Profitto Netto</div>
                <div class="stat-value sub-stats" id="profitto">-- €</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value sub-stats" id="winrate">--%</div>
            </div>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-bolt"></i> Ultime Schedine
        </div>
        
        <div id="storico">
            <div style="text-align: center; color: var(--text-muted); padding: 40px;">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <p style="margin-top: 10px;">Sincronizzazione col database...</p>
            </div>
        </div>

        <a href="https://t.me/+nyQkDOrFWrkyNGI8" class="cta-btn">
            <i class="fa-brands fa-telegram"></i> Entra nel Canale Telegram Ufficiale
        </a>
    </div>

    <script>
        // SOSTITUISCI "TUO_USERNAME" CON IL TUO NOME UTENTE DI GITHUB
        const RAW_URL = 'database.json';

        fetch(RAW_URL)
            .then(res => res.json())
            .then(data => {
                let capitale = data.capitale_iniziale;
                let vinte = 0, perse = 0;
                
                const contenitore = document.getElementById('storico');
                contenitore.innerHTML = ''; 
                
                data.schedine.slice().reverse().forEach(sc => {
                    if (sc.stato_schedina === 'vinta') {
                        capitale += (sc.ritorno_potenziale - sc.importo);
                        vinte++;
                    } else if (sc.stato_schedina === 'persa') {
                        capitale -= sc.importo;
                        perse++;
                    } else {
                        capitale -= sc.importo;
                    }

                    let matchesHTML = sc.partite.map(p => {
                        let icona = '<i class="fa-solid fa-clock m-attesa"></i>';
                        let classeEsito = 'm-attesa';
                        let score = p.risultato_reale || '';
                        
                        if(p.stato === 'vinta') {
                            icona = '<i class="fa-solid fa-check m-vinta"></i>';
                            classeEsito = 'm-vinta';
                        } else if(p.stato === 'persa') {
                            icona = '<i class="fa-solid fa-xmark m-persa"></i>';
                            classeEsito = 'm-persa';
                        }

                        return `
                        <div class="match">
                            <div>
                                <div class="m-teams">${p.squadra_casa} - ${p.squadra_trasferta}</div>
                                <div class="m-pick">${p.pronostico} @ ${p.quota}</div>
                            </div>
                            <div class="m-result ${classeEsito}">
                                ${score} ${icona}
                            </div>
                        </div>
                        `;
                    }).join('');

                    let colorQuota = sc.stato_schedina === 'vinta' ? 'var(--success)' : '#fff';

                    contenitore.innerHTML += `
                        <div class="schedina">
                            <div class="schedina-header">
                                <div class="schedina-info">
                                    <span class="s-date">${sc.data_creazione} • Investimento: ${sc.importo}€</span>
                                    <span class="s-quota" style="color: ${colorQuota}">Quota Totale: ${sc.quota_totale}</span>
                                </div>
                                <div class="badge ${sc.stato_schedina.replace(' ', '.')}">${sc.stato_schedina}</div>
                            </div>
                            <div>
                                ${matchesHTML}
                            </div>
                        </div>
                    `;
                });

                let profittoNetto = capitale - data.capitale_iniziale;
                let elCapitale = document.getElementById('capitale');
                let elProfitto = document.getElementById('profitto');
                
                elCapitale.innerText = capitale.toFixed(2) + ' €';
                elProfitto.innerText = (profittoNetto > 0 ? '+' : '') + profittoNetto.toFixed(2) + ' €';
                
                if(profittoNetto > 0) elProfitto.classList.add('profit');
                else if(profittoNetto < 0) elProfitto.classList.add('negative');

                let totali = vinte + perse;
                if (totali > 0) {
                    document.getElementById('winrate').innerText = Math.round((vinte / totali) * 100) + '%';
                }
            })
            .catch(err => {
                document.getElementById('storico').innerHTML = '<p style="text-align:center; color: var(--danger);">Errore nel caricamento del database algoritmico.</p>';
            });
    </script>
</body>
</html>
