name: SBR Social Manager Auto

on:
  schedule:
    - cron: '0 10 * * *'         # 1 post al giorno alle 11:00 italiane (ora solare)
    - cron: '*/10 7-22 * * *'    # Controlla ogni 10 min (08:00-23:00 IT) se hai premuto "Approva"
  workflow_dispatch:
    inputs:
      azione:
        description: 'Scegli azione (genera / pubblica)'
        required: true
        default: 'genera'
        type: choice
        options:
          - genera
          - pubblica
      forza_rubrica:
        description: 'Rubrica (solo se scegli genera)'
        required: false
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - DATA_MATCHUP
          - NUMERO_GIORNO
          - MITO_REALTA
          - VERDETTO_CAMPO
          - PARTITA_TRAPPOLA
          - DIARIO_OMEGA

permissions:
  contents: write

jobs:
  social_bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze e Chromium
        run: |
          pip install requests playwright tzdata
          playwright install chromium

      - name: Esegui Social Bot (Groq AI + Meta Graph API)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: |
          if [ "${{ github.event.schedule }}" = "*/10 7-22 * * *" ] || [ "${{ github.event.inputs.azione }}" = "pubblica" ]; then
            python bot_social_manager.py pubblica
          else
            python bot_social_manager.py genera ${{ github.event.inputs.forza_rubrica }}
          fi

      - name: Salva immagine JPG e stato nel repository
        run: |
          git config user.name "SBR Social Bot"
          git config user.email "bot@sbr.lab"
          git pull --rebase --autostash || true
          git add social_post_ready.jpg pending_social_post.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update social post SBR (.jpg)"
          git push
