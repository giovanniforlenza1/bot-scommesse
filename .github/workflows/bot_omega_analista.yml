name: Avvia Modello Omega (Analista)

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-analista:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests tzdata

      - name: Esegui Analista
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot_omega_analista.py

      - name: Salva il database delle analisi
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add database_analisi.json
          git commit -m "Generazione analisi giornaliera Modello Omega" || echo "Nessuna modifica al database"
          git push
