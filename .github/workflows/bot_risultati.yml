name: Aggiorna Risultati Dashboard

on:
  schedule:
    - cron: '0 */3 * * *' # Gira ogni 3 ore in automatico
  workflow_dispatch: # Permette di lanciarlo manualmente col tasto che usi tu

permissions:
  contents: write

jobs:
  aggiorna-risultati:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: 2. Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installa librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Esegui Bot Risultati
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHIAVE_A: ${{ secrets.CHIAVE_A }}
          CHIAVE_B: ${{ secrets.CHIAVE_B }}
          CHIAVE_C: ${{ secrets.CHIAVE_C }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python bot_risultati.py

      - name: 5. Pubblica il Database aggiornato sul Sito
        run: |
          git config --global user.name "SBR Results Bot"
          git config --global user.email "bot@sbr-results.com"
          git status
          git add database.json
          git commit -m "Aggiornamento automatico esiti partite" || echo "Nessuna modifica da committare"
          git push origin HEAD
