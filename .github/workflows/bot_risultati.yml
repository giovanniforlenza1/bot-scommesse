name: Aggiorna Risultati Dashboard

on:
  schedule:
    - cron: '0 */4 * * *' # Si attiva ogni 4 ore (00:00, 04:00, 08:00, 12:00, ecc.)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests tzdata

      - name: Lancia Bot Risultati
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot_risultati.py

      - name: Pubblica sul sito web
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add database.json
          git commit -m "Aggiornamento Risultati Schedine" || echo "Nessuna modifica"
          git push
