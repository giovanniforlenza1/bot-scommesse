name: SBR Master Engine

on:
  schedule:
    - cron: '45 7 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  CHIAVE_A: ${{ secrets.CHIAVE_A }}
  CHIAVE_B: ${{ secrets.CHIAVE_B }}
  CHIAVE_C: ${{ secrets.CHIAVE_C }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  API_KEY_ALPHA: ${{ secrets.API_KEY_ALPHA }}
  API_KEY_ARBITRO: ${{ secrets.API_KEY_ARBITRO }}
  API_FOOTBALL_OMEGA_KEY: ${{ secrets.API_FOOTBALL_OMEGA_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  OMEGA_CHAT_ID: ${{ secrets.OMEGA_CHAT_ID }}

jobs:
  esegui-sbr-quant:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installa librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Aggiorna Risultati Concluse
        run: |
          python aggiorna_risultati.py

      - name: 5. Esegui Modello OMEGA
        run: |
          python bot_omega_analista.py
          python bot_omega_cecchino.py

      - name: 6. Esegui Modello ALPHA
        run: |
          python bot_alpha_analista.py

      - name: 7. Esegui Modello BETA
        run: |
          python bot_beta.py

      - name: 8. Esegui Modello SIGMA (Tennis)
        run: |
          python bot_sigma_tennis.py

      - name: 9. Salva e pubblica i Database aggiornati sul Sito
        run: |
          git config --global user.name "SBR Quant Engine"
          git config --global user.email "bot@sbr-routing.com"
          git status
          git add -A
          git commit -m "Aggiornamento automatico SBR Engine" || echo "Nessuna modifica da salvare"
          git push origin HEAD
