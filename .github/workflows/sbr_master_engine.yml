name: SBR Master Engine

on:
  schedule:
    - cron: '45 7 * * *'
    - cron: '15 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  # PASSAGGIO GLOBALE DI TUTTE LE TUE CHIAVI SEGRETE A TUTTI I BOT
  CHIAVE_A: ${{ secrets.CHIAVE_A }}
  CHIAVE_B: ${{ secrets.CHIAVE_B }}
  CHIAVE_C: ${{ secrets.CHIAVE_C }}
  ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
  API_KEY_ALPHA: ${{ secrets.API_KEY_ALPHA }}
  API_KEY_ARBITRO: ${{ secrets.API_KEY_ARBITRO }}
  API_FOOTBALL_OMEGA_KEY: ${{ secrets.API_FOOTBALL_OMEGA_KEY }}
  API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
  FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  OMEGA_CHAT_ID: ${{ secrets.OMEGA_CHAT_ID }}

jobs:
  esegui-sbr-quant:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: 2. Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installa librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Aggiorna Risultati Concluse (Calcio & Tennis + Decrittazione Vault)
        run: |
          if [ -f "aggiorna_risultati.py" ]; then python aggiorna_risultati.py; fi
          if [ -f "bot_risultati.py" ]; then python bot_risultati.py; fi

      - name: 5. Esegui Modello OMEGA (Analista + Studio Squadre + Cecchino)
        run: |
          python bot_omega_analista.py
          python bot_omega_cecchino.py

      - name: 6. Esegui Modello ALPHA (Multipla Protetta Anti-Correlazione)
        run: |
          python bot_alpha_analista.py

      - name: 7. Esegui Modello BETA (Inferenza Poisson Corner & Cartellini)
        run: |
          python bot_beta.py

      - name: 8. Esegui Modello SIGMA (Laboratorio Tennis ATP/WTA - Solo Sito)
        run: |
          if [ -f "bot_sigma_tennis.py" ]; then python bot_sigma_tennis.py; fi

      - name: 9. Salva e pubblica i Database aggiornati sul Sito
        run: |
          git config --global user.name "SBR Quant Engine"
          git config --global user.email "bot@sbr-routing.com"
          git pull --rebase --autostash || true
          git add database.json database_analisi.json database_squadre.json tennis_test.json backups/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Aggiornamento automatico SBR Engine (Calcio + Tennis)"
          git push
