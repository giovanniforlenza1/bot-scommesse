name: Avvia Modello Beta (Corner)

on:
  schedule:
    # Esegue in automatico ogni venerdì e sabato alle 10:00 UTC (12:00 Italia)
    - cron: '0 10 * * 5,6'
  # Permette l'avvio manuale col bottone
  workflow_dispatch:

jobs:
  run-bot-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests tzdata scikit-learn numpy


      - name: Esegui Modello Beta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot_beta.py

      - name: Salva il database sul sito
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add database.json
          git commit -m "Aggiornamento schedine Modello Beta" || echo "Nessuna modifica al database"
          git push
