name: Alpha Analista

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurazione Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installazione dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install requests tzdata

    - name: Esecuzione Alpha Analista
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
        OMEGA_CHAT_ID: ${{ secrets.OMEGA_CHAT_ID }}
        ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      run: python bot_alpha_analista.py

    - name: Salva database analista
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "Aggiornamento Database Analista Alpha" || echo "Nessuna modifica"
        git pull --rebase origin main
        git push
