name: Esegui Alpha Analista

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests tzdata

      - name: Lancia Analista Alpha
        env:
          ODDS_API_KEY: ${{ secrets.API_KEY_ALPHA }}
        run: python bot_alpha_analista.py

      - name: Salva database analista
        run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "Aggiornamento Database" || echo "Nessuna modifica"
        git pull --rebase origin main
        git push

