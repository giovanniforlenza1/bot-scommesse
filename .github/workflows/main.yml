name: Motore Bot Telegram

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  esegui-bot:
    runs-on: ubuntu-latest
    steps:
      - name: clona il codice
        uses: actions/checkout@v4
        
      - name: installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: installa pacchetti
        run: pip install requests
        
      - name: avvia l'algoritmo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot_partite.py
        
      - name: salva il database
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add database.json
          git commit -m "aggiornamento automatico schedine e risultati" || echo "nessun aggiornamento necessario"
          git push
