name: Esegui Beta Analista

on:
  schedule:
    - cron: '0 8 * * *' # Gira ogni mattina alle 08:00 UTC (10:00 in Italia)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests tzdata

      - name: Esegui Analista Beta
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python bot_beta_analista.py

      - name: Salva database Beta
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add database_beta.json
          git commit -m "Aggiornamento Database Beta (Angoli/Cartellini)" || echo "Nessuna modifica"
          git push
