<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        body {
            width: 1080px; height: 1350px; margin: 0; padding: 90px;
            background: radial-gradient(circle at top right, #193863 0%, #102542 65%, #0a172a 100%);
            color: #FFFFFF; font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box;
        }
        .top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(179,163,148,0.25); padding-bottom: 30px; }
        .tag { background: rgba(248,112,96,0.18); color: #F87060; padding: 12px 26px; border-radius: 30px; font-weight: 800; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; }
        .date { font-family: 'JetBrains Mono', monospace; color: #B3A394; font-size: 26px; }
        .main-content { margin: auto 0; }
        .eyebrow { color: #B3A394; font-size: 32px; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 3px; }
        .headline { font-size: 78px; font-weight: 800; line-height: 1.08; letter-spacing: -2px; margin-bottom: 55px; }
        .accent { color: #F87060; }
        .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-left: 10px solid #F87060; border-radius: 24px; padding: 50px; }
        .teams { font-size: 50px; font-weight: 800; margin-bottom: 25px; color: #FFFFFF; }
        .story { font-size: 36px; line-height: 1.5; color: #CDD7D6; font-weight: 400; margin-bottom: 35px; }
        .metric-pill { display: inline-block; background: #102542; border: 2px solid #B3A394; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 30px; padding: 14px 28px; border-radius: 14px; }
        .footer { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid rgba(179,163,148,0.25); padding-top: 35px; font-size: 30px; }
        .cta { color: #B3A394; }
        .brand { font-weight: 800; font-size: 34px; letter-spacing: -1px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="tag">L'OCCHIO CLINICO • {{MODELLO}}</span>
        <span class="date">{{DATA_OGGI}}</span>
    </div>

    <div class="main-content">
        <div class="eyebrow">Lettura Tattica & Numeri</div>
        <div class="headline">{{TITOLO_CALDO}}</div>
        
        <div class="card">
            <div class="teams">{{MATCH}}</div>
            <div class="story">{{TESTO_STORYTELLING}}</div>
            <div class="metric-pill">🎯 Focus Algoritmo: <span class="accent">{{MERCATO_CHIAVE}}</span></div>
        </div>
    </div>

    <div class="footer">
        <span class="cta">📲 Analisi completa nel Telegram gratuito (Link in Bio)</span>
        <span class="brand">SBR <span class="accent">LAB</span></span>
    </div>
</body>
</html>
