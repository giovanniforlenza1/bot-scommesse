<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1080px; height: 1350px;
            background-color: #FFFFFF;
            color: #102542;
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
        }
        /* FOTO PROTAGONISTA: 820px DI ALTEZZA (OLTRE IL 60% DEL POST) */
        .hero-photo {
            width: 1080px; height: 820px;
            position: relative;
            background-color: #102542;
            overflow: hidden;
            border-bottom: 18px solid {{COLORE_BOT}};
        }
        .hero-photo img.bg {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center 15%;
        }
        .top-pill-bar {
            position: absolute; top: 45px; left: 55px; right: 55px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .model-badge {
            background-color: {{COLORE_BOT}};
            color: #FFFFFF;
            font-size: 24px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 1.5px; padding: 14px 28px; border-radius: 8px;
            border: 3px solid #FFFFFF;
        }
        .date-badge {
            background-color: #102542; color: #FFFFFF;
            font-size: 24px; font-weight: 800; padding: 14px 24px; border-radius: 8px;
            border: 3px solid #FFFFFF;
        }

        /* PARTE INFERIORE BIANCA E COMPATTEZZA CATCHY */
        .content-wrap {
            flex: 1;
            padding: 0 60px 45px 60px;
            display: flex; flex-direction: column; justify-content: space-between;
            background-color: #FFFFFF;
        }
        /* Banner Squadre grande a cavallo tra foto e bianco */
        .match-banner {
            margin-top: -64px;
            position: relative; z-index: 10;
            background-color: #FFFFFF;
            border: 4px solid #102542;
            border-radius: 14px;
            padding: 24px 36px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .team-side {
            display: flex; align-items: center; gap: 18px;
            font-size: 38px; font-weight: 900; color: #102542;
            letter-spacing: -1px; text-transform: uppercase;
        }
        .team-logo {
            width: 68px; height: 68px; object-fit: contain;
        }
        .vs-pill {
            background-color: {{COLORE_BOT}}; color: #FFFFFF;
            font-size: 22px; font-weight: 900; padding: 10px 18px; border-radius: 8px;
        }

        /* Blocco Testuale Poster (Pochi testi ma Enormi) */
        .editorial {
            margin: auto 0;
            padding: 15px 0;
        }
        .headline {
            font-size: 74px; font-weight: 900; line-height: 1.02;
            letter-spacing: -2.5px; color: #102542;
            text-transform: uppercase; margin-bottom: 18px;
        }
        .sub-hook {
            font-size: 36px; line-height: 1.3; color: #576574;
            font-weight: 700; margin-bottom: 28px;
        }

        .focus-box {
            background-color: #F4F6F6;
            border: 3px solid #102542;
            border-left: 16px solid {{COLORE_BOT}};
            padding: 22px 32px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .focus-label {
            font-size: 24px; font-weight: 800; color: #576574;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .focus-val {
            font-size: 36px; font-weight: 900; color: #102542;
            text-transform: uppercase; letter-spacing: -0.5px;
        }

        .footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 22px; border-top: 3px solid #F4F6F6;
        }
        .cta { font-size: 26px; font-weight: 800; color: #102542; }
        .brand { font-size: 34px; font-weight: 900; color: #102542; letter-spacing: -1px; }
        .brand span { color: #F87060; }
    </style>
</head>
<body>
    <div class="hero-photo">
        <img class="bg" src="{{FOTO_HD_URL}}" alt="Match Action">
        <div class="top-pill-bar">
            <span class="model-badge">{{ETICHETTA_BOT}}</span>
            <span class="date-badge">{{DATA_OGGI}}</span>
        </div>
    </div>

    <div class="content-wrap">
        <div class="match-banner">
            <div class="team-side">
                {{LOGO_CASA_HTML}}
                <span>{{SQUADRA_CASA}}</span>
            </div>
            <span class="vs-pill">VS</span>
            <div class="team-side">
                <span>{{SQUADRA_TRASFERTA}}</span>
                {{LOGO_TRASFERTA_HTML}}
            </div>
        </div>

        <div class="editorial">
            <div class="headline">{{TITOLO_CALDO}}</div>
            <div class="sub-hook">{{TESTO_STORYTELLING}}</div>
            <div class="focus-box">
                <span class="focus-label">🎯 Segnale Algoritmo</span>
                <span class="focus-val">{{MERCATO_CHIAVE}}</span>
            </div>
        </div>

        <div class="footer">
            <span class="cta">📲 Giocata gratis su Telegram • Link in Bio</span>
            <span class="brand">SBR <span>LAB</span></span>
        </div>
    </div>
</body>
</html>
