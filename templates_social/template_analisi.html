<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1080px; height: 1350px;
            background-color: #FFFFFF;
            color: #102542;
            font-family: 'Inter', sans-serif;
            padding: 85px;
            display: flex; flex-direction: column; justify-content: space-between;
            border-top: 18px solid {{COLORE_BOT}};
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 35px; border-bottom: 2px solid #CDD7D6;
        }
        .model-badge {
            background-color: {{COLORE_BOT}};
            color: #FFFFFF;
            font-size: 22px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.5px; padding: 12px 24px; border-radius: 6px;
        }
        .date { font-size: 26px; font-weight: 600; color: #576574; }

        .main { margin: auto 0; }
        .eyebrow {
            font-size: 26px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; color: #576574; margin-bottom: 18px;
        }
        .headline {
            font-size: 68px; font-weight: 800; line-height: 1.12;
            letter-spacing: -1.5px; color: #102542; margin-bottom: 50px;
        }

        .match-card {
            background-color: #F4F6F6;
            border: 2px solid #CDD7D6;
            border-left: 12px solid {{COLORE_BOT}};
            border-radius: 12px;
            padding: 50px;
        }
        .teams {
            font-size: 46px; font-weight: 800; color: #102542;
            margin-bottom: 22px; letter-spacing: -0.5px;
        }
        .story {
            font-size: 34px; line-height: 1.55; color: #576574;
            font-weight: 400; margin-bottom: 38px;
        }
        .pick-row {
            display: inline-flex; align-items: center; gap: 14px;
            background-color: #FFFFFF; border: 2px solid #CDD7D6;
            padding: 16px 28px; border-radius: 8px;
            font-size: 28px; font-weight: 700; color: #102542;
        }
        .dot {
            width: 14px; height: 14px; border-radius: 50%;
            background-color: {{COLORE_BOT}};
        }

        .footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 35px; border-top: 2px solid #CDD7D6;
        }
        .cta { font-size: 26px; font-weight: 600; color: #576574; }
        .brand { font-size: 32px; font-weight: 800; color: #102542; letter-spacing: -0.5px; }
        .brand span { color: #F87060; }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="model-badge">{{ETICHETTA_BOT}}</span>
        <span class="date">{{DATA_OGGI}}</span>
    </div>

    <div class="main">
        <div class="eyebrow">L'Occhio Clinico • Analisi Pre-Match</div>
        <div class="headline">{{TITOLO_CALDO}}</div>

        <div class="match-card">
            <div class="teams">{{MATCH}}</div>
            <div class="story">{{TESTO_STORYTELLING}}</div>
            <div class="pick-row">
                <span class="dot"></span>
                <span>Focus Modello: {{MERCATO_CHIAVE}}</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <span class="cta">Canale Telegram gratuito • Link in Bio</span>
        <span class="brand">SBR <span>LAB</span></span>
    </div>
</body>
</html>
