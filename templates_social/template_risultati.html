<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1080px; height: 1350px;
            background-color: #FFFFFF;
            color: #102542;
            font-family: 'Inter', sans-serif;
            padding: 85px;
            display: flex; flex-direction: column; justify-content: space-between;
            border-top: 18px solid #102542;
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 35px; border-bottom: 2px solid #CDD7D6;
        }
        .status-tag {
            background-color: #ECFDF5; color: #10B981; border: 2px solid #BBF7D0;
            font-size: 22px; font-weight: 700; text-transform: uppercase;
            padding: 10px 22px; border-radius: 6px; letter-spacing: 1px;
        }
        .period { font-size: 26px; font-weight: 600; color: #576574; }

        .title {
            font-size: 64px; font-weight: 800; color: #102542;
            letter-spacing: -1.5px; line-height: 1.1; margin: 40px 0 14px;
        }
        .subtitle { font-size: 32px; color: #576574; margin-bottom: 45px; }

        .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-bottom: 40px; }
        .kpi-card {
            background-color: #F4F6F6; border: 2px solid #CDD7D6;
            border-radius: 10px; padding: 34px;
        }
        .kpi-label {
            font-size: 22px; font-weight: 700; color: #576574;
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
        }
        .kpi-val { font-size: 56px; font-weight: 800; color: #102542; }

        .history-card {
            background-color: #FFFFFF; border: 2px solid #CDD7D6;
            border-radius: 10px; padding: 15px 38px;
        }
        .row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 26px 0; border-bottom: 2px solid #F4F6F6;
            font-size: 30px; font-weight: 600; color: #102542;
        }
        .row:last-child { border-bottom: none; }
        .mod-pill {
            font-size: 20px; font-weight: 700; text-transform: uppercase;
            background-color: #F4F6F6; border: 1px solid #CDD7D6;
            color: #576574; padding: 6px 14px; border-radius: 4px; margin-right: 14px;
        }
        .esito-vinto {
            background-color: #ECFDF5; color: #10B981; border: 2px solid #BBF7D0;
            padding: 8px 20px; border-radius: 6px; font-size: 24px; font-weight: 700;
        }
        .esito-perso {
            background-color: #FEF2F2; color: #EF4444; border: 2px solid #FECACA;
            padding: 8px 20px; border-radius: 6px; font-size: 24px; font-weight: 700;
        }

        .footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 35px; border-top: 2px solid #CDD7D6;
            font-size: 26px; font-weight: 600; color: #576574;
        }
        .brand { font-size: 32px; font-weight: 800; color: #102542; }
        .brand span { color: #F87060; }
    </style>
</head>
<body>
    <div>
        <div class="top-bar">
            <span class="status-tag">✓ STORICO CERTIFICATO</span>
            <span class="period">{{PERIODO}}</span>
        </div>

        <div class="title">Il verdetto del campo.</div>
        <div class="subtitle">Rendicontazione trasparente estratta dal database storico SBR.</div>

        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-label">Operazioni Chiuse</div>
                <div class="kpi-val">{{TOTALE_CHIUSE}}</div>
            </div>
            <div class="kpi-card">
                <div class="kpi-label">Win Rate Globale</div>
                <div class="kpi-val">{{WINRATE}}</div>
            </div>
        </div>

        <div class="history-card">
            {{RIGHE_OPERAZIONI}}
        </div>
    </div>

    <div class="footer">
        <span>Storico integrale consultabile nel Link in Bio</span>
        <span class="brand">SBR <span>LAB</span></span>
    </div>
</body>
</html>
