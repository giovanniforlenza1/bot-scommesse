<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1080px; height: 1350px;
            background-color: #FFFFFF;
            color: #102542;
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column;
        }
        /* HEADER PIATTO CORALLO/BLU */
        .top-strip {
            background-color: #102542;
            color: #FFFFFF;
            padding: 38px 65px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 12px solid #F87060;
        }
        .strip-tag {
            background-color: #10B981; color: #FFFFFF;
            font-size: 22px; font-weight: 900; text-transform: uppercase;
            padding: 10px 22px; border-radius: 6px; letter-spacing: 1.5px;
        }
        .strip-date {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px; font-weight: 700; color: #B3A394;
        }

        /* CORPO CENTRALE ASIMMETRICO */
        .main-wrap {
            flex: 1;
            padding: 60px 65px 45px 65px;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .big-header {
            font-size: 80px; font-weight: 900; line-height: 0.98;
            letter-spacing: -3px; text-transform: uppercase; color: #102542;
            margin-bottom: 35px;
        }
        .big-header span { color: #F87060; }

        /* BLOCCO HERO KPI GIGANTE IN TINTA PIATTA */
        .hero-kpi-banner {
            display: grid; grid-template-columns: 1.25fr 0.75fr;
            border: 4px solid #102542; border-radius: 16px;
            overflow: hidden; margin-bottom: 40px;
        }
        .kpi-left {
            background-color: #102542; color: #FFFFFF;
            padding: 42px 45px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .kpi-left-lbl {
            font-size: 22px; font-weight: 800; color: #B3A394;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
        }
        .kpi-left-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 118px; font-weight: 800; line-height: 1; color: #10B981;
            letter-spacing: -4px;
        }
        .kpi-right {
            background-color: #F4F6F6; color: #102542;
            padding: 42px 40px;
            border-left: 4px solid #102542;
            display: flex; flex-direction: column; justify-content: center;
        }
        .kpi-right-lbl {
            font-size: 22px; font-weight: 800; color: #576574;
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px;
        }
        .kpi-right-val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 86px; font-weight: 800; line-height: 1; color: #102542;
        }

        /* LISTA TICKET STILE SCONTRINO */
        .section-lbl {
            font-size: 22px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 2px; color: #576574; margin-bottom: 16px;
        }
        .tickets-stack {
            display: flex; flex-direction: column; gap: 18px;
            margin-bottom: auto;
        }
        .row {
            background-color: #FFFFFF;
            border: 3px solid #102542;
            border-radius: 12px;
            padding: 24px 30px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 31px; font-weight: 800; color: #102542;
        }
        .mod-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px; font-weight: 800; text-transform: uppercase;
            background-color: #102542; color: #FFFFFF;
            padding: 8px 16px; border-radius: 6px; margin-right: 18px;
        }
        .esito-vinto {
            background-color: #ECFDF5; color: #10B981; border: 3px solid #10B981;
            padding: 8px 22px; border-radius: 8px; font-size: 24px; font-weight: 900;
            text-transform: uppercase;
        }
        .esito-perso {
            background-color: #FEF2F2; color: #EF4444; border: 3px solid #EF4444;
            padding: 8px 22px; border-radius: 8px; font-size: 24px; font-weight: 900;
            text-transform: uppercase;
        }

        .footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 28px; border-top: 3px solid #CDD7D6;
        }
        .cta { font-size: 26px; font-weight: 800; color: #102542; }
        .brand { font-size: 34px; font-weight: 900; color: #102542; letter-spacing: -1px; }
        .brand span { color: #F87060; }
    </style>
</head>
<body>
    <div class="top-strip">
        <span class="strip-tag">✓ DATABASE CERTIFICATO</span>
        <span class="strip-date">{{PERIODO}}</span>
    </div>

    <div class="main-wrap">
        <div class="big-header">{{TITOLO_RISULTATI}}</div>

        <div class="hero-kpi-banner">
            <div class="kpi-left">
                <div class="kpi-left-lbl">Precisione Globale</div>
                <div class="kpi-left-val">{{WINRATE}}</div>
            </div>
            <div class="kpi-right">
                <div class="kpi-right-lbl">Analisi Chiuse</div>
                <div class="kpi-right-val">{{TOTALE_CHIUSE}}</div>
            </div>
        </div>

        <div>
            <div class="section-lbl">Ultime Operazioni Registrate a Sistema</div>
            <div class="tickets-stack">
                {{RIGHE_OPERAZIONI}}
            </div>
        </div>

        <div class="footer">
            <span class="cta">📊 Storico pubblico integrale • Link in Bio</span>
            <span class="brand">SBR <span>LAB</span></span>
        </div>
    </div>
</body>
</html>
