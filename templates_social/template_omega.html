<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1080px; height: 1350px;
            background-color: #FFFFFF;
            color: #102542;
            font-family: 'Inter', sans-serif;
            padding: 85px;
            display: flex; flex-direction: column; justify-content: space-between;
            border-top: 18px solid #102542;
        }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 35px; border-bottom: 2px solid #CDD7D6;
        }
        .omega-badge {
            background-color: #102542; color: #FFFFFF;
            font-size: 22px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.5px; padding: 12px 24px; border-radius: 6px;
        }
        .status-pill {
            background-color: #F4F6F6; color: #102542; border: 2px solid #B3A394;
            font-size: 22px; font-weight: 700; padding: 10px 20px; border-radius: 6px;
        }

        .center { margin: auto 0; }
        .eyebrow {
            font-size: 26px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 2px; color: #B3A394; margin-bottom: 20px;
        }
        .big-title {
            font-size: 72px; font-weight: 800; line-height: 1.1;
            letter-spacing: -2px; color: #102542; margin-bottom: 45px;
        }
        .narrative-box {
            background-color: #F4F6F6;
            border: 2px solid #CDD7D6;
            border-left: 12px solid #102542;
            border-radius: 12px;
            padding: 48px;
            font-size: 36px; line-height: 1.55; color: #576574;
        }
        .specs-bar {
            margin-top: 35px;
            background-color: #FFFFFF; border: 2px solid #CDD7D6;
            border-radius: 10px; padding: 28px 36px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 26px; font-weight: 700; color: #102542;
        }

        .footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 35px; border-top: 2px solid #CDD7D6;
            font-size: 26px; font-weight: 600; color: #576574;
        }
        .brand { font-size: 32px; font-weight: 800; color: #102542; }
        .brand span { color: #F87060; }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="omega-badge">MODELLO OMEGA • QUANTITATIVO</span>
        <span class="status-pill">IN CALIBRAZIONE 🔒</span>
    </div>

    <div class="center">
        <div class="eyebrow">Diario dal Laboratorio</div>
        <div class="big-title">{{TITOLO_OMEGA}}</div>
        <div class="narrative-box">{{TESTO_OMEGA}}</div>

        <div class="specs-bar">
            <span>Motore Monte Carlo • 10.000 Simulazioni</span>
            <span style="color:#F87060;">Accesso Privato</span>
        </div>
    </div>

    <div class="footer">
        <span>Alpha, Beta & Tennis attivi gratis su Telegram</span>
        <span class="brand">SBR <span>LAB</span></span>
    </div>
</body>
</html>
